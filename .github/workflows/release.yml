name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs derives the version from the tag
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Build the FleetSuite SPA first — the wheel ships it (hatch `artifacts`).
      - run: npm ci && npm run build
        working-directory: web-ui
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      # Smoke: the wheel must contain the built SPA and import cleanly with no extras.
      - run: |
          python -m zipfile -l dist/*.whl | grep -q "web/static/index.html"
          python -m venv /tmp/smoke && /tmp/smoke/bin/pip install -q dist/*.whl
          /tmp/smoke/bin/python -c "import meshtastic_mcp.server"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    # Only publish from a version tag — a manual workflow_dispatch run stops at
    # the build artifact instead of pushing a dev version to PyPI.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC) — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-mcp-registry:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # registry login via GitHub OIDC, which grants io.github.meshtastic/*
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        env:
          PUBLISHER_VERSION: v1.8.1
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Stamp server.json with the tag version
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v | .packages[].version = $v' server.json > server.tmp
          mv server.tmp server.json
      - run: ./mcp-publisher login github-oidc
      # The registry proves ownership from the mcp-name line in the PyPI README, which PyPI
      # can take a minute to serve for a release it has just accepted.
      - name: Publish to the MCP Registry
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "attempt ${attempt} failed, retrying in 30s"
            sleep 30
          done
          exit 1
